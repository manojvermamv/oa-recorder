[project]
name = "openalgo-recorder"
version = "0.1.0"
description = "Standalone add-on that records OpenAlgo market data (ticks, depth, option chain, bars) to Parquet every trading day."
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "pyarrow>=15",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
oar = "oar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["oar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
