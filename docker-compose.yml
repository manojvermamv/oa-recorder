# Runs oar next to an OpenAlgo that is already running in Docker on the same host.
#
#   cp .env.example .env
#   cp config.example.toml config.toml
#   docker compose build
#   docker compose run --rm --user root -v "$PWD/.env:/app/.env" oar setup   # API key, typed hidden
#   docker compose up -d
#   docker compose logs -f
#
# oar joins OpenAlgo's Docker network and reaches it by container name.
# Find the network with:  docker inspect openalgo-web -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'

services:
  oar:
    build: .
    image: openalgo-recorder:latest
    container_name: oar
    restart: unless-stopped
    env_file: .env
    environment:
      OAR_HOST: ${OAR_HOST:-http://openalgo-web:5000}
      OAR_WS_URL: ${OAR_WS_URL:-ws://openalgo-web:8765}
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ${OAR_DATA_PATH:-./data}:/data
    networks: [openalgo]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

networks:
  openalgo:
    external: true
    name: ${OPENALGO_NETWORK:-openalgo_default}
